[project]
name = "brain"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0.3,<7.0.0",
    "SQLAlchemy>=2.0.43,<3.0.0",
    "aiohttp>=3.13.3,<4.0.0",
    "alembic>=1.16.5,<2.0.0",
    "fastapi>=0.121.2,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "langfuse>=3.0.0,<4.0.0",
    "mcp>=1.27.0,<2.0.0",
    "opentelemetry-api>=1.38.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0,<1.0.0",
    "opentelemetry-instrumentation-httpx>=0.62b0,<1.0.0",
    "opentelemetry-sdk>=1.41.0,<2.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "pydantic-ai-slim>=1.64.0,<2.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest>=9.0.2,<10.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "python-ulid>=3.1.0,<4.0.0",
    "qdrant-client>=1.15.1,<2.0.0",
    "ruff>=0.13.0,<1.0.0",
    "textual>=8.1.1,<9.0.0",
    "typer>=0.24.1,<1.0.0",
    "uvicorn>=0.40.0,<1.0.0",
    "valkey>=6.0.0,<7.0.0",
]

[tool.ruff]
exclude = ["deprecated"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
