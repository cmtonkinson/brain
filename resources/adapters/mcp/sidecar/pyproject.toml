[project]
name = "brain-mcp-adapter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0.3,<7.0.0",
    "fastapi>=0.121.2,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "mcp>=1.27.0,<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "uvicorn>=0.40.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.13.0,<1.0.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
