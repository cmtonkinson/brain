/health: full-system diagnostic health check
/ops/always-on: return full descriptors for the configured always-on ops
/ops/describe: enumerate all active ops
/ops/describe-one: return one full Op descriptor by op_id
/ops/dynamic/classifications: list observed dynamic ops and persisted classifications
/ops/dynamic/classify: persist one operator-supplied dynamic op classification
/ops/invoke: execute tool calls
/ops/search: semantically search the enabled Op catalog and return compact matches
/ops/slash-lookup: resolve one op descriptor by slash command name or alias
/ops/tool-system-hints: return compact orientation hints for systems reachable through tools
/policy/approval_response: record an operator approval or rejection for a pending Policy proposal
/policy/approval_status: return current status for one Policy approval proposal
/lms/chat: direct access to model inference without Execution/Policy overhead
/lms/chat-with-tools: direct access to tool-capable model inference without Execution/Policy overhead
/memory/create_session: create one new Recall session for the Assistant
/memory/get_latest_or_create_session: return the latest Recall session id or create one for the Assistant
/memory/assemble_context: assemble Recall context for one inbound turn
/memory/assemble_snapshot: return the stable historical Recall snapshot without the live inbound turn
/memory/record_inbound_turn: persist one inbound Recall turn before prompt assembly
/memory/record_outbound_candidate: persist one outbound Recall candidate turn before delivery
/memory/record_outbound_delivery: persist the final delivery state for one outbound Recall turn
/memory/compact_dialogue: force-summarize all visible turns and advance dialogue frontier
/memory/record_response: persist one outbound Recall response turn
/relay/ingest_inbound_message: accept one normalized inbound operator message
/relay/poll_console_response: dequeue the next queued Brain response for the console channel
/relay/poll_operator_instruction: dequeue the next queued operator instruction for the Assistant
/ingestion/submit: validate and submit one ingestion attempt; runs store stage inline
/ingestion/get: read one ingestion record by id
/ingestion/status: return current status snapshot for one ingestion
/ingestion/results: return stage-ordered artifact outcomes for one ingestion
/ingestion/list: list ingestions with optional status filter and cursor pagination
/ingestion/retry-stage: retry one named stage for an existing ingestion
/ingestion/replay: replay an ingestion from the named stage forward
/ingestion/health: return Ingestion Service readiness status
/jobs/create: create a job intent, job record, and initial audit entry
/jobs/get: read one job by id
/jobs/list: list jobs with optional filters and cursor pagination
/jobs/pause: transition a job from active to paused
/jobs/resume: transition a job from paused to active and recompute next_run
/jobs/cancel: cancel a job and clear its next_run
/jobs/run-now: immediately queue an execution for an active or paused job
/jobs/executions/claim: atomically claim the next queued execution for a Worker Actor
/jobs/executions/complete: report a successful execution result from a Worker Actor
/jobs/executions/fail: report a failed execution result from a Worker Actor
/jobs/executions/get: read one job execution by id
/jobs/executions/list: list executions for one job with cursor pagination
/jobs/audits/list: list audit entries for one job with cursor pagination
/jobs/predicate-evaluations/list: list predicate evaluation records for one job
/jobs/update: update mutable fields on an existing job
/jobs/health: return Job Service and provider health state
/commitment/create: create a commitment directly or persist a creation proposal
/commitment/extract-candidates: extract zero or more commitment candidate signals from arbitrary text
/commitment/get: read one commitment by id
/commitment/health: return Commitment Service readiness status
/commitment/history: return one commitment plus its progress and transition history
/commitment/list: list commitments with optional state filter and cursor pagination
/commitment/progress: record one progress event for a commitment
/commitment/review-items: list review items for one persisted review run
/commitment/review-run: read one persisted commitment review run by id
/commitment/transition: apply one commitment state transition or persist a transition proposal
/commitment/update: update one commitment without changing lifecycle state
/delegation/invoke: queue one delegated subagent invocation
/delegation/invoke-and-wait: queue one delegated subagent invocation and block until terminal state
/delegation/wait: block until a previously queued subagent invocation reaches terminal state
/delegation/status: return current status projection for one subagent invocation
/delegation/cancel: request cancellation of one queued or running subagent invocation
/delegation/claim: atomically claim the next queued subagent invocation for the Subagent Actor
/delegation/record-turn: increment per-turn counters and return whether to keep running
/delegation/finalize: apply terminal status to one subagent invocation
