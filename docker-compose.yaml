services:

  brain-core:
    build:
      context: .
      dockerfile: Dockerfile.core
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    restart: unless-stopped
    user: "0:0"
    environment:
      BRAIN_CORE_HTTP__SOCKET_PATH: /run/brain/brain.sock
    volumes:
      - ${HOME}/.config/brain:/app/config:ro
      - ${HOME}/.config/brain/generated:/app/config/generated:rw
      - brain-socket:/run/brain
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      signal-api:
        condition: service_started

  brain-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    restart: unless-stopped
    user: "0:0"
    environment:
      BRAIN_ACTORS_CORE__SOCKET_PATH: /run/brain/brain.sock
    volumes:
      - ${HOME}/.config/brain:/app/config:ro
      - ${HOME}/.config/brain/generated:/app/config/generated:rw
      - brain-socket:/run/brain
    depends_on:
      brain-core:
        condition: service_healthy

  signal-api:
    image: ${SIGNAL_CLI_REST_API_IMAGE:-bbernhard/signal-cli-rest-api:latest}
    restart: unless-stopped
    environment:
      MODE: ${SIGNAL_CLI_REST_API_MODE:-json-rpc}
      JSON_RPC_IGNORE_ATTACHMENTS: ${SIGNAL_CLI_REST_API_JSON_RPC_IGNORE_ATTACHMENTS:-true}
      JSON_RPC_IGNORE_STORIES: ${SIGNAL_CLI_REST_API_JSON_RPC_IGNORE_STORIES:-true}
    volumes:
      - ${SIGNAL_CLI_CONFIG_DIR:-./data/signal-cli}:/home/.local/share/signal-cli

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  brain-socket:
