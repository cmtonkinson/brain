services:
  brain-core:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    user: "0:0"
    environment:
      BRAIN_CORE__HTTP__HOST: 0.0.0.0
      BRAIN_CORE__HTTP__PORT: 8898
      BRAIN_SEAWEEDFS__ENDPOINT_URL: http://seaweedfs:8333
      BRAIN_SEAWEEDFS__BUCKET: ${BRAIN_SEAWEEDFS__BUCKET:-brain-oas}
      BRAIN_SEAWEEDFS__ACCESS_KEY_ID: ${BRAIN_SEAWEEDFS__ACCESS_KEY_ID:-replace-me}
      BRAIN_SEAWEEDFS__SECRET_ACCESS_KEY: ${BRAIN_SEAWEEDFS__SECRET_ACCESS_KEY:-replace-me}
      # Pin Software Service staging_root to a host-shaped path so it
      # matches the symmetric bind mount below: brain-core writes
      # worktrees at the same absolute path the host Docker daemon sees,
      # so DooD task spawns can mount worktrees without translation.
      BRAIN_SOFTWARE__STAGING_ROOT: ${XDG_STATE_HOME:-${HOME}/.local/state}/brain/software-tasks
      # Coding Adapter secret allowlist sources values from this process's
      # env. Each `coding.executors.<id>.env_keys` entry is read here and
      # injected into task containers — agent CLIs need their respective
      # API keys to authenticate. Unset keys flow through as absent (the
      # task container starts without them; the agent CLI will fail loudly
      # on first call, which is the desired loud-failure behavior).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    volumes:
      - ${XDG_CONFIG_HOME:-${HOME}/.config}/brain:/app/config:ro
      # Slash authenticity secret. Mounted into brain-core only; not into
      # brain-assistant / brain-worker / brain-subagent so LLM-driven code
      # cannot mint a valid HMAC for operator-typed slash commands.
      - ${XDG_STATE_HOME:-${HOME}/.local/state}/brain:/root/.local/state/brain:rw
      # Software Service staging root. Symmetric host:host mount so
      # brain-core and the host Docker daemon see worktrees at one
      # identical absolute path — no host-vs-container translation when
      # the Coding Adapter spawns sibling task containers.
      - ${XDG_STATE_HOME:-${HOME}/.local/state}/brain/software-tasks:${XDG_STATE_HOME:-${HOME}/.local/state}/brain/software-tasks:rw
      - ./logs:/app/logs
      - ./scripts/healthcheck-core.sh:/usr/local/bin/brain-healthcheck:ro
      # Coding Adapter (DooD): Brain Core launches sibling task containers
      # via the host Docker daemon. See ADR 0001.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BRAIN_CORE__PORT_BIND:-8898:8898}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
      brain-mcp:
        condition: service_healthy
    command: ["python", "-m", "lib.core.main"]

  brain-assistant:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    user: "0:0"
    environment:
      BRAIN_CORE__HOST: brain-core
      BRAIN_CORE__PORT: 8898
      BRAIN_ASSISTANT_HEARTBEAT_FILE: /run/brain/assistant-heartbeat
      BRAIN_ASSISTANT_HEARTBEAT_MAX_AGE_SECONDS: 90
    volumes:
      - ${XDG_CONFIG_HOME:-${HOME}/.config}/brain:/app/config:ro
      - ./logs:/app/logs
      - ./scripts/healthcheck-assistant.sh:/usr/local/bin/brain-healthcheck:ro
    depends_on:
      brain-core:
        condition: service_healthy
    command: ["python", "-m", "actors.assistant.main"]

  brain-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    user: "0:0"
    environment:
      BRAIN_CORE__HOST: brain-core
      BRAIN_CORE__PORT: 8898
      BRAIN_WORKER_HEARTBEAT_FILE: /run/brain/worker-heartbeat
      BRAIN_WORKER_HEARTBEAT_MAX_AGE_SECONDS: 90
    volumes:
      - ${XDG_CONFIG_HOME:-${HOME}/.config}/brain:/app/config:ro
      - ./logs:/app/logs
      - ./scripts/healthcheck-worker.sh:/usr/local/bin/brain-healthcheck:ro
    depends_on:
      brain-core:
        condition: service_healthy
    command: ["python", "-m", "actors.worker.main"]

  brain-subagent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    user: "0:0"
    environment:
      BRAIN_CORE__HOST: brain-core
      BRAIN_CORE__PORT: 8898
      BRAIN_SUBAGENT_HEARTBEAT_FILE: /run/brain/subagent-heartbeat
      BRAIN_SUBAGENT_HEARTBEAT_MAX_AGE_SECONDS: 90
    volumes:
      - ${XDG_CONFIG_HOME:-${HOME}/.config}/brain:/app/config:ro
      - ./logs:/app/logs
      - ./scripts/healthcheck-subagent.sh:/usr/local/bin/brain-healthcheck:ro
    depends_on:
      brain-core:
        condition: service_healthy
    command: ["python", "-m", "actors.subagent.main"]

  brain-mcp:
    build:
      context: ./resources/adapters/mcp/sidecar
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    environment:
      MCP_ADAPTER_CONFIG_FILE: /app/config/mcp-adapter.yaml
    volumes:
      - ${XDG_CONFIG_HOME:-${HOME}/.config}/brain:/app/config:ro
      - ${BRAIN_MCP_FILESYSTEM_RO_SOURCE:-${HOME}}:/mnt/host:ro
    healthcheck:
      test:
        ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:8763/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--loglevel", "warning"]
    ports:
      - "${BRAIN_VALKEY__PORT_BIND:-8761:6379}"
    volumes:
      - brain-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17
    restart: unless-stopped
    environment:
      QDRANT__LOG_LEVEL: WARN
    ports:
      - "${BRAIN_QDRANT__PORT_BIND:-8762:6333}"
    volumes:
      - brain-qdrant:/qdrant/storage

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command:
      [
        "-logtostderr=false",
        "-alsologtostderr=false",
        "-stderrthreshold",
        "1",
        "server",
        "-dir=/data",
        "-s3",
        "-s3.port=8333",
      ]
    volumes:
      - brain-seaweedfs:/data
    ports:
      - "${BRAIN_SEAWEEDFS__PORT_BIND:-8333:8333}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8333 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  seaweedfs-init:
    image: amazon/aws-cli:2.32.17
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${BRAIN_SEAWEEDFS__ACCESS_KEY_ID:-replace-me}
      AWS_SECRET_ACCESS_KEY: ${BRAIN_SEAWEEDFS__SECRET_ACCESS_KEY:-replace-me}
      AWS_DEFAULT_REGION: us-east-1
      SEAWEEDFS_OAS_BUCKET: ${BRAIN_SEAWEEDFS__BUCKET:-brain-oas}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$${SEAWEEDFS_OAS_BUCKET}" 2>/dev/null || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket "$${SEAWEEDFS_OAS_BUCKET}"
    depends_on:
      seaweedfs:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_messages=warning"]
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    ports:
      - "${BRAIN_POSTGRES__PORT_BIND:-8760:5432}"
    volumes:
      - brain-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 3s
      retries: 10

  signal-api:
    # Gated behind the "signal" Compose profile: only starts when the
    # operator opted in to Signal during `make install` (the Makefile reads
    # `~/.config/brain/secrets.yaml` and adds `--profile signal` when
    # `signal.receive_e164` is set).
    profiles: ["signal"]
    image: ${SIGNAL_CLI_REST_API_IMAGE:-bbernhard/signal-cli-rest-api:latest}
    restart: unless-stopped
    depends_on:
      brain-core:
        condition: service_healthy
    environment:
      LOG_LEVEL: warn
      MODE: ${SIGNAL_CLI_REST_API_MODE:-json-rpc}
      JSON_RPC_IGNORE_ATTACHMENTS: ${SIGNAL_CLI_REST_API_JSON_RPC_IGNORE_ATTACHMENTS:-true}
      JSON_RPC_IGNORE_STORIES: ${SIGNAL_CLI_REST_API_JSON_RPC_IGNORE_STORIES:-true}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--fail",
          "http://127.0.0.1:8080/v1/health",
        ]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 30s
    volumes:
      - ${SIGNAL_CLI_CONFIG_DIR}:/home/.local/share/signal-cli

volumes:
  brain-valkey:
  brain-qdrant:
  brain-seaweedfs:
  brain-postgres:
